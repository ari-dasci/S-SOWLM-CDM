[project]
name = "local-llm-cdm"
version = "1.0.0"
description = "Code and data for 'Small Open-Weight Language Models for Crowd Decision-Making from Textual Opinions: Reliability of Linguistic Aggregation and Output-Level Fusion'"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }

# Lower bounds; the reported values were produced with numpy 2.5, scipy 1.18
# and pandas 3.0 on Python 3.14.
dependencies = [
    "numpy>=2.0",
    "scipy>=1.11",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "pyyaml>=6.0",
    # Collection only (scripts/collect.sh).
    "typer>=0.12",
    "rich>=13.0",
    "pydantic>=2.0",
    "openai>=1.0",
    "ollama>=0.3",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["backends", "experiments", "models", "utils"]
py-modules = ["sentiment_prompt_runner"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "PIE", "ISC", "RUF"]
ignore = ["UP042", "RUF001", "RUF002", "SIM108"]

[tool.ruff.lint.per-file-ignores]
# Parser fixtures are real model responses, reproduced verbatim.
"tests/test_parsing.py" = ["E501"]
"backends/ollama.py" = ["E501"]
