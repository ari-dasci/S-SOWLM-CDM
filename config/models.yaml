# Models the runner accepts: family -> size -> backend id. The id is what the
# runner writes into <results-dir>/<model_id>/ and what config/profiles.yaml
# reads back as `raw`.
gemma4:
  sizes:
    e4b:
      ollama: gemma4:e4b
    31b:
      ollama: gemma4:31b
  default_size: e4b

ministral:
  sizes:
    8b:
      ollama: ministral-3:8b
  default_size: 8b

ornith:
  sizes:
    35b:
      ollama: ornith:35b
  default_size: 35b

qwen36:
  sizes:
    35b:
      ollama: qwen3.6:35b
  default_size: 35b

gpt:
  sizes:
    "5.2":
      openai: gpt-5.2-2025-12-11
  default_size: "5.2"
